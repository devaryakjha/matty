# cargo-deny: licenses, advisories, bans and sources. `cargo deny check` in CI.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices only fail for Matty's direct dependencies; GPUI's
# transitive ones (zbus, rustybuzz, paste, ...) are upstream's to replace.
unmaintained = "workspace"

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    # File-level copyleft, used by GPUI's font stack (zed-font-kit and friends).
    # Allowed for linking; modified MPL files would have to stay MPL.
    "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
