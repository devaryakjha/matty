[package]
name = "spike-s1"
description = "Spike S1 (#57): variable-height message list under resize and prepend."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "spike-s1"
path = "src/main.rs"

[dependencies]
gpuicn.workspace = true
gpui-kit.workspace = true
gpui_platform.workspace = true
gpui-icons.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
runtime_shaders = ["gpui_platform/runtime_shaders"]
