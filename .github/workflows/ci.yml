name: CI

# The tiers of docs/engineering-process.md, section 5.2:
#
# - T1, every pull request push: fmt, Linux clippy, macOS clippy and the
#   plain-Rust checks; cargo-deny when the dependencies change.
# - T2, every master push (and the merge queue): T1 plus the workspace tests
#   on Linux and macOS, the web build and the live tests on Mattermost 12.0.
#   The packaging jobs join when their own files change.
# - T3, nightly when master moved (or by hand): the macOS release build and
#   dev bundle, the universal bundle, the Linux packages, both Windows jobs,
#   the live tests on every supported Mattermost, and cargo-deny.
#
# A label pulls more into a pull request: `tests`, `web`, `macos` (tests and
# the universal bundle), `linux` (packages), `windows`, `integration`, or
# `full-ci` for all of them. Use the narrowest one. Linux and macOS jobs run
# on Karya's self-hosted runners when the organization variables
# KARYA_LINUX_RUNNER and KARYA_MACOS_RUNNER (or the older repository
# variables MATTY_*_RUNNER) name them. See docs/CI.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [master]
  merge_group:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its older run. Adding a label that is
# not a CI label gets a group of its own, so it never cancels a real run.
# Every master run goes ahead, except that the master jobs with their own
# concurrency below queue one at a time.
concurrency:
  group: >-
    ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}${{
    github.event.action == 'labeled' &&
    !contains(fromJSON('["tests","web","macos","linux","windows","integration","full-ci"]'), github.event.label.name) &&
    format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Stays on GitHub's runners: it takes seconds, and it decides where and
    # whether the rest run, so it must not wait behind them.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      linux-runner: ${{ steps.runners.outputs.linux }}
      macos-runner: ${{ steps.runners.outputs.macos }}
      tier: ${{ steps.plan.outputs.tier }}
      lint: ${{ steps.plan.outputs.lint }}
      tests: ${{ steps.plan.outputs.tests }}
      web: ${{ steps.plan.outputs.web }}
      deny: ${{ steps.plan.outputs.deny }}
      macos: ${{ steps.plan.outputs.macos }}
      macos-tests: ${{ steps.plan.outputs.macos-tests }}
      macos-release: ${{ steps.plan.outputs.macos-release }}
      universal: ${{ steps.plan.outputs.universal }}
      linux-package: ${{ steps.plan.outputs.linux-package }}
      windows: ${{ steps.plan.outputs.windows }}
      windows-package: ${{ steps.plan.outputs.windows-package }}
      integration: ${{ steps.plan.outputs.integration }}
    steps:
      # The runner variables hold a runs-on value: a JSON list of labels such
      # as ["self-hosted","Linux","X64","matty"], or one label. Unset, the
      # jobs use GitHub's runners, so deleting a variable is the way back
      # when a machine is down. Pull requests from forks always get GitHub's
      # runners: their code never runs on our machines.
      - name: Pick the runners
        id: runners
        env:
          LINUX: ${{ vars.KARYA_LINUX_RUNNER || vars.MATTY_LINUX_RUNNER }}
          MACOS: ${{ vars.KARYA_MACOS_RUNNER || vars.MATTY_MACOS_RUNNER }}
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          pick() {
            local value="$1" fallback="$2"
            if [[ "$TRUSTED" != true || -z "$value" ]]; then
              value="$fallback"
            fi
            # A JSON list or string stays as it is; a bare label is quoted.
            jq -ce . <<<"$value" 2>/dev/null || jq -cn --arg v "$value" '$v'
          }
          {
            echo "linux=$(pick "$LINUX" ubuntu-latest)"
            echo "macos=$(pick "$MACOS" macos-15)"
          } | tee -a "$GITHUB_OUTPUT"
      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: code
        with:
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'
              - '!NOTICE'
          predicate-quantifier: every
      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: shell
          base: ${{ github.event.merge_group.base_sha }}
          ref: ${{ github.event.merge_group.head_sha }}
          filters: |
            deps:
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - 'deny.toml'
            packaging:
              - 'packaging/**'
              - 'scripts/*-package'
              - 'scripts/release-*'
              - 'scripts/dev-bundle'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            windows:
              - 'crates/matty-notify/**'
              - 'crates/matty-app/src/logging.rs'
              - 'crates/matty-app/src/actions.rs'
              - 'crates/matty-app/src/menu.rs'
              - 'crates/matty-app/Cargo.toml'
              - 'crates/matty/**'
              - 'packaging/windows/**'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
            windows-package:
              - 'packaging/windows/**'
              - 'scripts/windows-package'
            new-images:
              - added: 'docs/**/*.{png,jpg,jpeg,gif,webp,mp4,mov}'
      # Nightly runs only when master moved since the last good nightly.
      - name: Did master move since the last nightly
        id: moved
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=schedule&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')"
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "Master is still at ${GITHUB_SHA::7}, which the last nightly checked."
            echo "moved=false" >>"$GITHUB_OUTPUT"
          else
            echo "moved=true" >>"$GITHUB_OUTPUT"
          fi
      # PR screenshots go to karyalabs/assets, not the repository (D6 in
      # docs/engineering-process.md): every clone carries every image.
      - name: No new images under docs/
        if: github.event_name == 'pull_request' && steps.filter.outputs.new-images == 'true'
        env:
          FILES: ${{ steps.filter.outputs.new-images_files }}
        run: |
          echo "::error::This pull request adds images under docs/: $FILES"
          echo "Put screenshots in karyalabs/assets (matty/<PR number>/...) and link them from the PR body; see AGENTS.md."
          exit 1
      # Every decision about what runs is made here, so the jobs below only
      # read a flag.
      - name: Plan the run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          MOVED: ${{ steps.moved.outputs.moved }}
          CODE: ${{ steps.code.outputs.code }}
          DEPS: ${{ steps.filter.outputs.deps }}
          PACKAGING: ${{ steps.filter.outputs.packaging }}
          WINDOWS: ${{ steps.filter.outputs.windows }}
          WINDOWS_PACKAGE: ${{ steps.filter.outputs.windows-package }}
        run: |
          ci_labels=" tests web macos linux windows integration full-ci "
          has() { [[ " $LABELS " == *" $1 "* || " $LABELS " == *" full-ci "* ]]; }
          case "$EVENT" in
            pull_request)
              if [[ "$ACTION" == labeled && "$ci_labels" != *" $LABEL "* ]]; then
                tier=none
              else
                tier=pr
              fi ;;
            push|merge_group) tier=merge ;;
            schedule) [ "$MOVED" = true ] && tier=nightly || tier=none ;;
            workflow_dispatch) tier=nightly ;;
          esac
          lint=false tests=false web=false deny=false macos=false macos_tests=false
          macos_release=false universal=false linux_package=false windows=false
          windows_package=false integration='[]'
          case "$tier" in
            pr)
              if [ "$CODE" = true ]; then
                lint=true macos=true
                has tests && tests=true
                has web && web=true
                [ "$DEPS" = true ] || has full-ci && deny=true
                has macos && macos_tests=true universal=true
                has linux && linux_package=true
                has windows && windows=true windows_package=true
                has integration && integration='["12.0","10.5"]'
              fi ;;
            merge)
              if [ "$CODE" = true ]; then
                lint=true tests=true web=true macos=true macos_tests=true
                integration='["12.0"]'
                [ "$DEPS" = true ] && deny=true
                [ "$PACKAGING" = true ] && universal=true linux_package=true
                [ "$WINDOWS" = true ] && windows=true
                [ "$WINDOWS_PACKAGE" = true ] && windows_package=true
              fi ;;
            nightly)
              deny=true macos=true macos_release=true universal=true
              linux_package=true windows=true windows_package=true
              integration='["12.0","11.7","10.11","10.5"]' ;;
          esac
          {
            echo "tier=$tier"
            echo "lint=$lint"
            echo "tests=$tests"
            echo "web=$web"
            echo "deny=$deny"
            echo "macos=$macos"
            echo "macos-tests=$macos_tests"
            echo "macos-release=$macos_release"
            echo "universal=$universal"
            echo "linux-package=$linux_package"
            echo "windows=$windows"
            echo "windows-package=$windows_package"
            echo "integration=$integration"
          } | tee -a "$GITHUB_OUTPUT"

  # fmt, clippy and the plain-Rust checks on Linux (T1); T2 also runs the
  # workspace tests.
  linux:
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux-runner) }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      # Each of matty-app's test binaries links all of GPUI, and together
      # they filled the runner's disk mid cargo test (#575). Drop toolchains
      # this job never uses to make room.
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - name: Install GPUI's Linux libraries
        run: |
          scripts/ci/apt-install \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libvulkan-dev libx11-xcb-dev libxcb1-dev \
            dbus-daemon
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: needs.changes.outputs.tests == 'true'
        run: cargo test --workspace --locked
      - name: Plain-Rust crates do not depend on GPUI
        run: scripts/check-no-gpui.sh
      - name: The app never opens the database itself
        run: scripts/check-app-no-db.sh

  # The browser build (docs/web.md): it compiles, links, fits Cloudflare's
  # 25 MiB file limit, and the result is kept for a manual deploy.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux-runner) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-17
          targets: wasm32-unknown-unknown
          components: rust-src
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          key: web
          cache-directories: target/web
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install wasm-bindgen and wasm-opt
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          scripts/ci/fetch-tool wasm-bindgen "$version" \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" - \
            "wasm-bindgen-$version-x86_64-unknown-linux-musl/wasm-bindgen" 1
          scripts/ci/fetch-tool wasm-opt 132 \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz - \
            binaryen-version_132/bin/wasm-opt 2
      - run: scripts/web build
      - uses: actions/upload-artifact@v4
        with:
          name: matty-web
          path: crates/matty-web/dist
          if-no-files-found: error
          retention-days: 7

  deny:
    needs: changes
    # When the dependencies change, and nightly for new advisories.
    if: needs.changes.outputs.deny == 'true'
    # Stays on GitHub's runners: it takes about a minute, and the action
    # runs in a root container that would leave root-owned files in a
    # self-hosted runner's reused checkout.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # macOS clippy on every pull request (it sees the macOS-only code Linux
  # clippy cannot), the tests in T2, the release build and the dev bundle
  # nightly.
  macos:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos-runner) }}
    # On master a running macOS job finishes, and only the newest waiting
    # one is kept, so merges in quick succession do not cancel it forever.
    concurrency:
      group: ${{ github.event_name == 'push' && 'macos-master' || format('macos-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 40
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --locked --features matty/runtime_shaders -- -D warnings
      - if: needs.changes.outputs.macos-tests == 'true'
        run: cargo test --workspace --locked --features matty/runtime_shaders
      - if: needs.changes.outputs.macos-release == 'true'
        run: cargo build --release --locked -p matty --features runtime_shaders
      - if: needs.changes.outputs.macos-release == 'true'
        run: target/release/matty --version
      - name: The development app bundle builds and verifies
        if: needs.changes.outputs.macos-release == 'true'
        run: MATTY_BIN=target/release/matty scripts/dev-bundle
      - if: needs.changes.outputs.macos-release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: matty-macos-arm64
          path: target/release/matty
          if-no-files-found: error
          retention-days: 7
      - name: Report a macOS break on master
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="macOS CI is failing on master"
          body="The macOS job failed on ${GITHUB_SHA::7}: $RUN_URL"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

  macos-universal:
    # The release bundle (#177): both slices, lipo, Info.plist, ad hoc
    # signature. The release workflow builds the same thing from a tag and
    # signs it for real when the secrets are there. It is slow and macOS
    # runners are scarce, so it runs nightly, on master when the packaging
    # changes, and on a pull request with the `macos` label.
    name: macos universal bundle
    needs: changes
    if: needs.changes.outputs.universal == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos-runner) }}
    # On master a running macOS job finishes, and only the newest waiting
    # one is kept, so merges in quick succession do not cancel it forever.
    concurrency:
      group: ${{ github.event_name == 'push' && 'macos-universal-master' || format('macos-universal-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          key: universal
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build target/dist/Matty.app
        run: MATTY_BUILD_NUMBER=${{ github.run_number }} scripts/release-bundle
      - name: The bundle is universal, signed and runs
        run: |
          app=target/dist/Matty.app
          file "$app/Contents/MacOS/matty"
          archs=" $(lipo -archs "$app/Contents/MacOS/matty") "
          [[ "$archs" == *" arm64 "* && "$archs" == *" x86_64 "* ]]
          codesign --verify --strict --verbose=2 "$app"
          plutil -p "$app/Contents/Info.plist"
          "$app/Contents/MacOS/matty" --version
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 "$app/Contents/MacOS/matty" --version
          else
            echo "Rosetta is not installed: skipping the x86_64 slice run"
          fi
      - name: Zip the bundle
        # ditto keeps the executable bit and the signature, which the
        # artifact upload would otherwise lose.
        run: ditto -c -k --keepParent target/dist/Matty.app target/dist/Matty-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: matty-macos-universal
          path: target/dist/Matty-macos-universal.zip
          if-no-files-found: error
          retention-days: 7

  # Windows (#215): clippy and the workspace tests on Windows. There is no
  # self-hosted Windows machine, so it runs nightly, on master when Windows
  # code changes, and on a pull request with the `windows` label.
  windows:
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-latest
    concurrency:
      group: ${{ github.event_name == 'push' && 'windows-master' || format('windows-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - if: github.event_name != 'pull_request'
        run: cargo build --release --locked -p matty
      - if: github.event_name != 'pull_request'
        run: target/release/matty.exe --version
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: matty-windows-x86_64
          path: target/release/matty.exe
          if-no-files-found: error
          retention-days: 7

  # The Linux packages (#216): a release build packaged as a tarball, .deb,
  # .rpm and AppImage, with the desktop entry and AppStream data validated.
  # Nothing is signed or published. A release build is slow, so it runs
  # nightly, on master when the packaging changes, and on a pull request
  # with the `linux` label.
  linux-package:
    name: linux packages
    needs: changes
    if: needs.changes.outputs.linux-package == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux-runner) }}
    concurrency:
      group: ${{ github.event_name == 'push' && 'linux-package-master' || format('linux-package-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      - name: Install GPUI's Linux libraries and the packaging tools
        run: |
          scripts/ci/apt-install \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfontconfig-dev libvulkan-dev libx11-xcb-dev libxcb1-dev \
            rpm desktop-file-utils appstream
          scripts/ci/fetch-tool appimagetool 1.9.0 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage \
            46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
          # appimagetool would fetch this itself, without retrying a 504.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/appimage-runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "MATTY_APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime-x86_64" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-release
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: The desktop entry and AppStream data are valid
        run: |
          desktop-file-validate packaging/linux/dev.arya.matty.desktop
          appstreamcli validate --no-net --explain packaging/linux/dev.arya.matty.metainfo.xml
      - name: Build the packages
        run: scripts/linux-package "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "matty") | .version')"
      - name: The packages hold the app and it runs
        run: |
          cd target/dist/linux
          ls -l
          dpkg-deb --info matty_*_amd64.deb
          dpkg-deb --contents matty_*_amd64.deb | grep -q './usr/bin/matty'
          rpm -qlp matty-*.rpm | grep -q '^/usr/bin/matty$'
          APPIMAGE_EXTRACT_AND_RUN=1 ./Matty-*-x86_64.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: matty-linux-x86_64
          path: target/dist/linux
          if-no-files-found: error
          retention-days: 7

  # The Windows installer (#215): a release build packaged as an MSI and a
  # zip, then installed and uninstalled to check the MSI works. Nothing is
  # signed or published. It runs nightly, on master when the Windows
  # packaging changes, and on a pull request with the `windows` label.
  windows-package:
    name: windows installer
    needs: changes
    if: needs.changes.outputs.windows-package == 'true'
    runs-on: windows-latest
    concurrency:
      group: ${{ github.event_name == 'push' && 'windows-package-master' || format('windows-package-{0}', github.run_id) }}
      cancel-in-progress: false
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-release
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the installer
        run: scripts/windows-package "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "matty") | .version')"
      - name: The installer installs, runs and uninstalls
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/dist/windows/*.msi | Select-Object -First 1
          Start-Process msiexec -ArgumentList "/i `"$($msi.FullName)`" /qn /l*v install.log" -Wait -NoNewWindow
          $exe = "$env:LOCALAPPDATA\Programs\Matty\matty.exe"
          if (-not (Test-Path $exe)) { Get-Content install.log -Tail 40; throw "matty.exe was not installed" }
          & $exe --version
          if (-not (Test-Path "HKCU:\Software\Classes\mattermost\shell\open\command")) { throw "mattermost:// is not registered" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter Matty.lnk -Recurse
          if (-not $lnk) { throw "no Start menu shortcut" }
          Start-Process msiexec -ArgumentList "/x `"$($msi.FullName)`" /qn" -Wait -NoNewWindow
          if (Test-Path $exe) { throw "matty.exe is still there after uninstalling" }
      - uses: actions/upload-artifact@v4
        with:
          name: matty-windows-x86_64-installer
          path: target/dist/windows
          if-no-files-found: error
          retention-days: 7

  integration:
    # The live suites of the plain-Rust crates against the seeded Docker
    # Mattermost server (docs/dev-server.md). They are the slowest part of
    # CI, so pull requests skip them unless labelled `integration`; master
    # runs the current release, the nightly run every supported version,
    # and a failure there opens an issue like the macOS job does.
    name: integration (Mattermost ${{ matrix.server }})
    needs: changes
    if: needs.changes.outputs.integration != '[]'
    # Stays on GitHub's runners. On the self-hosted box the server could
    # not reach the tests' stand-in integrations on the host, and four
    # servers next to the builds made the timing-sensitive tests fail.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        # The current release and the extended support releases still
        # getting patches (PLAN §6.3), plus 10.5, the dev server's default.
        server: ${{ fromJSON(needs.changes.outputs.integration) }}
    env:
      MATTY_MM_VERSION: ${{ matrix.server }}
      MATTY_TEST_PASSWORD: Password1!
      # Several of these can share one self-hosted machine, so each gets
      # its own containers and volumes, and a free port (next step).
      COMPOSE_PROJECT_NAME: matty-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest.
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: runner.environment == 'self-hosted'
        run: scripts/ci/prepare-workspace
      - name: Pick a free port for the server
        run: |
          port="$(python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1])')"
          echo "MATTY_MM_PORT=$port" >>"$GITHUB_ENV"
          echo "MATTY_TEST_SERVER=http://localhost:$port" >>"$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      # Self-hosted runners keep target/ instead.
      - if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.server == '12.0' }}
      - name: Start the server in the background
        # Docker Hub now and then refuses an anonymous pull ("unauthorized:
        # authentication required"), so starting is retried. Images a
        # self-hosted machine already has are not pulled again.
        run: |
          for attempt in 1 2 3 4; do
            docker compose -f docker/compose.yml up -d --quiet-pull && break
            [ "$attempt" = 4 ] && exit 1
            echo "Start failed, retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
      - name: Build the tests while it starts
        run: cargo test --locked -p matty-api -p matty-store -p matty-sync --no-run
      - name: Wait for the server
        run: scripts/dev-server up
      - name: Seed
        run: python3 scripts/seed.py --server "$MATTY_TEST_SERVER"
      - name: Test against the server
        run: cargo test --locked -p matty-api -p matty-store -p matty-sync
      - name: Collect the server logs
        if: failure()
        # Also in the job log: artifacts need a browser session to download.
        run: |
          docker compose -f docker/compose.yml logs --no-color > mattermost.log
          tail -n 200 mattermost.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mattermost-${{ matrix.server }}-logs
          path: mattermost.log
          retention-days: 7
      - name: Report an integration break on master
        if: failure() && (github.event_name == 'push' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER: ${{ matrix.server }}
        run: |
          title="Integration tests are failing on master"
          body="Mattermost $SERVER failed on ${GITHUB_SHA::7}: $RUN_URL"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
      - name: Remove the server
        # A self-hosted machine would otherwise keep every run's containers.
        if: always()
        run: docker compose -f docker/compose.yml down --volumes --remove-orphans --timeout 5

  # One check to wait on: green when every job that ran passed and the rest
  # were skipped on purpose.
  ci:
    if: ${{ !cancelled() }}
    needs: [changes, linux, web, deny, macos, macos-universal, windows, linux-package, windows-package, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - name: Every job passed or was skipped
        env:
          TIER: ${{ needs.changes.outputs.tier }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          RESULTS: >-
            changes=${{ needs.changes.result }}
            linux=${{ needs.linux.result }}
            web=${{ needs.web.result }}
            deny=${{ needs.deny.result }}
            macos=${{ needs.macos.result }}
            macos-universal=${{ needs.macos-universal.result }}
            windows=${{ needs.windows.result }}
            linux-package=${{ needs.linux-package.result }}
            windows-package=${{ needs.windows-package.result }}
            integration=${{ needs.integration.result }}
        run: |
          # A run for a label that is not a CI label checks nothing itself:
          # it repeats the result of the latest other `ci` check on the
          # commit, so it can neither hide a failure nor fail a green PR.
          if [ "$TIER" = none ] && [ "$EVENT" = pull_request ]; then
            latest="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci&filter=all" \
              --jq "[.check_runs[] | select(.details_url | contains(\"/runs/$GITHUB_RUN_ID/\") | not)] | sort_by(.started_at) | last | .conclusion // \"\"")"
            echo "The latest other ci check on ${SHA::7}: ${latest:-none or still running}"
            [ "$latest" != failure ] && [ "$latest" != timed_out ]
            exit
          fi
          # On master the jobs with their own concurrency group keep only
          # the newest waiting run, so an older one may be cancelled: the
          # newer run checks the same code. Nothing else may be cancelled.
          queued=" macos macos-universal windows linux-package windows-package "
          status=0
          for pair in $RESULTS; do
            job="${pair%%=*}" result="${pair#*=}"
            echo "$job: $result"
            case "$result" in
              success|skipped) ;;
              cancelled) [ "$EVENT" = push ] && [[ "$queued" == *" $job "* ]] || status=1 ;;
              *) status=1 ;;
            esac
          done
          exit "$status"
