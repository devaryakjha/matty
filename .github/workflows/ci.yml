name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to a pull request cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked --features matty/runtime_shaders -- -D warnings
      - run: cargo test --workspace --locked --features matty/runtime_shaders
      - name: Plain-Rust crates do not depend on GPUI
        run: scripts/check-no-gpui.sh
      - run: cargo build --release --locked -p matty --features runtime_shaders
      - run: target/release/matty --version
      - uses: actions/upload-artifact@v4
        with:
          name: matty-macos-arm64
          path: target/release/matty
          if-no-files-found: error

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  integration:
    # Runs the Docker Mattermost suite once #48 lands; skipped until then.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
