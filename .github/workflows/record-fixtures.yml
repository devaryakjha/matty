# Records matty-api fixtures from a fresh, seeded server of each version
# asked for (#19). Each version's files are uploaded as an artifact and
# pushed alone to the branch fixtures/v<version>, to merge or check out. Run it from the
# Actions tab, or: gh workflow run record-fixtures.yml -f versions="12.0 10.11"
name: record fixtures

on:
  workflow_dispatch:
    inputs:
      versions:
        description: Mattermost image tags, separated by spaces
        required: true
        default: "12.0"

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.split.outputs.versions }}
    steps:
      - id: split
        env:
          VERSIONS: ${{ inputs.versions }}
        run: echo "versions=$(jq -cn --arg v "$VERSIONS" '$v | split(" ") | map(select(. != ""))')" >> "$GITHUB_OUTPUT"

  record:
    needs: matrix
    name: record (Mattermost ${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.matrix.outputs.versions) }}
    permissions:
      contents: write
    env:
      MATTY_MM_VERSION: ${{ matrix.server }}
    steps:
      - uses: actions/checkout@v4
      - name: Start the server
        run: scripts/dev-server up
      - name: Seed
        run: python3 scripts/seed.py
      - name: Record
        run: python3 scripts/record-fixtures.py --version "${{ matrix.server }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures-v${{ matrix.server }}
          path: crates/matty-api/tests/fixtures/v${{ matrix.server }}
          if-no-files-found: error
      - name: Push the files to fixtures/v${{ matrix.server }}
        env:
          VERSION: ${{ matrix.server }}
        run: |
          dir="crates/matty-api/tests/fixtures/v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "fixtures/v$VERSION"
          git add "$dir"
          git commit -m "Record fixtures from Mattermost $VERSION"
          git push --force origin "fixtures/v$VERSION"
