name: Release

# Merging a release PR is the release (docs/releasing.md): when the version
# in Cargo.toml's [workspace.package] is not released yet, a push to master
# builds every platform from that commit, waits for its CI to pass, then
# tags it v<version>, publishes the GitHub release (a pre-release for a
# version like 0.1.0-beta.6), bumps the Homebrew cask for a stable version,
# and deploys matty.jha.sh. Each release carries the signed macOS DMG and
# zip and the unsigned Linux (#216) and Windows (#215) packages. A manual
# run, and the Monday run, are dry runs: everything but publishing.
#
# Optional repository secrets. Without them the app is ad hoc signed and the
# release notes say so:
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  its export password
#   APPLE_NOTARY_KEY_P8         contents of an App Store Connect API key (.p8)
#   APPLE_NOTARY_KEY_ID         that key's id
#   APPLE_NOTARY_ISSUER         its issuer id
#   HOMEBREW_TAP_TOKEN          lets the homebrew job open the cask bump PR
#   MATTY_UPDATE_SIGNING_KEY    ed25519 private key (PEM) that signs the in-app
#                               updater's manifest (#180); see scripts/update-manifest
# and one repository variable, the public half the app checks against:
#   MATTY_UPDATE_PUBLIC_KEY     base64 of the 32-byte ed25519 public key
# Without the key the release carries no update manifest, and without the
# variable the build does not check for updates.
#
# The macOS and Linux builds run on the self-hosted runners that the
# organization variables KARYA_MACOS_RUNNER and KARYA_LINUX_RUNNER (or the
# older MATTY_* repository variables) name, as in
# CI (docs/self-hosted-runners.md), and on GitHub's runners while they are
# unset. Only master's own commits run here, never a pull request's.
#
# The Cloudflare deploy needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# in the `release` environment; without them it only writes a notice.
on:
  # Merging a release PR is the release: it bumps [workspace.package]
  # version in Cargo.toml and adds the CHANGELOG.md entry.
  push:
    branches: [master]
    paths: [Cargo.toml]
  # A manual run builds, signs and notarizes without publishing, unless
  # `publish` is ticked (to finish a release whose run failed).
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (otherwise a dry run)
        type: boolean
        default: false
  # Every Monday, a dry run of the whole pipeline on master, so a broken
  # step shows up before release day.
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          tag="v$version"
          sha="$(git rev-parse HEAD)"
          prerelease=false
          [[ "$version" != *-* ]] || prerelease=true
          released=false
          gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null | grep -qx false && released=true
          build=true publish=false
          case "$EVENT" in
            push)
              if [[ "$released" == true ]]; then
                echo "$tag is released already; a release PR bumps the version."
                build=false
              else
                publish=true
              fi ;;
            workflow_dispatch)
              if [[ "$PUBLISH" == true ]]; then
                if [[ "$released" == true ]]; then
                  echo "::error::$tag is released already; bump the version in a release PR."
                  exit 1
                fi
                publish=true
              fi ;;
          esac
          if [[ "$publish" == true ]]; then
            echo "Releasing $tag from ${sha::7}"
          elif [[ "$build" == true ]]; then
            echo "Dry run of $tag from ${sha::7}: build, sign and notarize, publish nothing"
          fi
          {
            echo "build=$build"
            echo "publish=$publish"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "tag=$tag"
            echo "sha=$sha"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: macos universal
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ fromJSON(vars.KARYA_MACOS_RUNNER || vars.MATTY_MACOS_RUNNER || '"macos-15"') }}
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notarized: ${{ steps.package.outputs.notarized }}
    env:
      # Developer ID signing and notarization (#178) are skipped, and the
      # build is ad hoc signed, while these secrets are not set.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_NOTARY_KEY_P8 != '' && secrets.APPLE_NOTARY_KEY_ID != '' && secrets.APPLE_NOTARY_ISSUER != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest, including any older release in target/dist.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: karyalabs/.github/actions/self-hosted-prep@v1

      - name: The version to build
        id: version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >>"$GITHUB_OUTPUT"

      - uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Import the Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/matty-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "::add-mask::$keychain_password"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode >"$cert"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -f pkcs12 -T /usr/bin/codesign
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          # Prepend to the search list so codesign finds the identity. The
          # list has no trailing newline once joined, so read reports end of
          # input and fails under bash -e; the array is filled all the same.
          read -r -a existing < <(security list-keychains -d user | tr -d '"' | tr '\n' ' ') || true
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -n 1)"
          if [[ -z "$identity" ]]; then
            echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"
            exit 1
          fi
          echo "MATTY_SIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "MATTY_KEYCHAIN=$keychain" >>"$GITHUB_ENV"

      - name: Build target/dist/Matty.app
        env:
          MATTY_VERSION: ${{ steps.version.outputs.version }}
          MATTY_BUILD_NUMBER: ${{ github.run_number }}
          UPDATE_PUBLIC_KEY: ${{ vars.MATTY_UPDATE_PUBLIC_KEY }}
        run: |
          # The updater (#180) is compiled in only with a public key to
          # check manifests against; MATTY_VERSION gives it the full version.
          if [[ -n "$UPDATE_PUBLIC_KEY" ]]; then
            export MATTY_UPDATE_PUBLIC_KEY="$UPDATE_PUBLIC_KEY"
          else
            echo "::warning::MATTY_UPDATE_PUBLIC_KEY is not set; this build will not update itself"
          fi
          scripts/release-bundle

      - name: The bundle is universal and signed
        run: |
          app=target/dist/Matty.app
          file "$app/Contents/MacOS/matty"
          archs=" $(lipo -archs "$app/Contents/MacOS/matty") "
          [[ "$archs" == *" arm64 "* && "$archs" == *" x86_64 "* ]]
          codesign --verify --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Signature)=' || true
          "$app/Contents/MacOS/matty" --version

      - name: Package the DMG, zip and SHA256SUMS
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          MATTY_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          MATTY_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          notarized=false
          if [[ "$HAS_NOTARY" == true && -n "${MATTY_SIGN_IDENTITY:-}" ]]; then
            export MATTY_NOTARY_KEY="$RUNNER_TEMP/notary-key.p8"
            printf '%s\n' "$APPLE_NOTARY_KEY_P8" >"$MATTY_NOTARY_KEY"
            notarized=true
          else
            # Notarization needs a Developer ID signature.
            unset MATTY_NOTARY_KEY_ID MATTY_NOTARY_ISSUER
          fi
          scripts/release-package "$VERSION"
          rm -f "$RUNNER_TEMP/notary-key.p8"
          echo "notarized=$notarized" >>"$GITHUB_OUTPUT"

      - name: Remove the signing keychain
        if: always() && env.MATTY_KEYCHAIN != ''
        run: security delete-keychain "$MATTY_KEYCHAIN"

      - uses: actions/upload-artifact@v4
        with:
          name: matty-release
          path: target/dist/release/
          if-no-files-found: error

  linux:
    # The Linux packages (#216): tarball, .deb, .rpm and AppImage, unsigned.
    name: linux x86_64
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ fromJSON(vars.KARYA_LINUX_RUNNER || vars.MATTY_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          # A self-hosted runner keeps target/ warm between jobs; the next
          # step clears the rest, including any older release in target/dist.
          clean: ${{ runner.environment != 'self-hosted' }}
      - uses: karyalabs/.github/actions/self-hosted-prep@v1
      - name: Install GPUI's Linux libraries
        uses: karyalabs/.github/actions/gpui-deps@v1
        with:
          extra: rpm desktop-file-utils appstream
      - name: Install the packaging tools
        run: |
          scripts/ci/fetch-tool appimagetool 1.9.0 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage \
            46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1
          # appimagetool would fetch this itself, without retrying a 504.
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o "$RUNNER_TEMP/appimage-runtime-x86_64" \
            https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          echo "MATTY_APPIMAGE_RUNTIME=$RUNNER_TEMP/appimage-runtime-x86_64" >> "$GITHUB_ENV"
      - uses: karyalabs/.github/actions/rust-toolchain@v1
      - name: Build the packages
        env:
          MATTY_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/linux-package "$MATTY_VERSION"
      - name: The packages hold the app and it runs
        run: |
          cd target/dist/linux
          ls -l
          dpkg-deb --contents matty_*_amd64.deb | grep -q './usr/bin/matty'
          rpm -qlp matty-*.rpm | grep -q '^/usr/bin/matty$'
          APPIMAGE_EXTRACT_AND_RUN=1 ./Matty-*-x86_64.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: matty-release-linux
          path: target/dist/linux/
          if-no-files-found: error

  windows:
    # The Windows MSI and zip (#215), unsigned.
    name: windows x86_64
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: karyalabs/.github/actions/rust-toolchain@v1
      - name: Install WiX
        run: dotnet tool install --global wix --version 5.0.2
      - name: Build the installer
        env:
          MATTY_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          scripts/windows-package "$MATTY_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: matty-release-windows
          path: target/dist/windows/
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [plan, build, linux, windows]
    # A failed Linux or Windows build leaves that platform out rather than
    # holding back the release; macOS is the one the release needs.
    if: always() && needs.build.result == 'success' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      checks: read
    env:
      HAS_UPDATE_KEY: ${{ secrets.MATTY_UPDATE_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          sparse-checkout: |
            scripts
            CHANGELOG.md
      # Nothing is published from a commit whose CI is not green. The builds
      # above take longer than CI, so this rarely waits.
      - name: CI passed on the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          for _ in $(seq 1 60); do
            read -r status conclusion < <(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci&filter=latest" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | "\(.status // "missing") \(.conclusion // "none")"')
            echo "ci on ${SHA::7}: $status $conclusion"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] && exit 0
              echo "::error::CI did not pass on ${SHA::7}; fix master and release again"
              exit 1
            fi
            sleep 30
          done
          echo "::error::CI on ${SHA::7} did not finish in 30 minutes"
          exit 1
      - uses: actions/download-artifact@v4
        with:
          pattern: matty-release*
          path: artifacts
      - name: The checksums match, then gather one release folder
        run: |
          mkdir release
          for dir in artifacts/*/; do
            (cd "$dir" && sha256sum --check SHA256SUMS)
            cat "$dir/SHA256SUMS" >>release/SHA256SUMS.all
            rm "$dir/SHA256SUMS"
            mv "$dir"* release/
          done
          sort -k2 release/SHA256SUMS.all >release/SHA256SUMS
          rm release/SHA256SUMS.all
          cat release/SHA256SUMS
      - name: Sign the update manifest
        env:
          MATTY_UPDATE_SIGNING_KEY: ${{ secrets.MATTY_UPDATE_SIGNING_KEY }}
          MATTY_UPDATE_PUBLIC_KEY: ${{ vars.MATTY_UPDATE_PUBLIC_KEY }}
          MATTY_RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          if [[ "$HAS_UPDATE_KEY" != true ]]; then
            echo "MATTY_UPDATE_SIGNING_KEY is not set; the release carries no update manifest"
            exit 0
          fi
          export MATTY_UPDATE_SIGNING_KEY_FILE="$RUNNER_TEMP/update-key.pem"
          (umask 077 && printf '%s\n' "$MATTY_UPDATE_SIGNING_KEY" >"$MATTY_UPDATE_SIGNING_KEY_FILE")
          status=0
          scripts/update-manifest "$VERSION" release \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG" || status=$?
          rm -f "$MATTY_UPDATE_SIGNING_KEY_FILE"
          exit "$status"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          NOTARIZED: ${{ needs.build.outputs.notarized }}
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          # The tag is created here, on the release commit.
          args=(--target "$SHA" --title "Matty $VERSION" --generate-notes)
          [[ "$PRERELEASE" != true ]] || args+=(--prerelease)
          if [[ "$NOTARIZED" == true ]]; then
            notes="**macOS:** download the DMG, open it and drag Matty to Applications."
          else
            notes="**macOS:** this build is not signed with a Developer ID or notarized. macOS will refuse to open it at first: right-click Matty.app, choose Open, then confirm, or run \`xattr -dr com.apple.quarantine /Applications/Matty.app\`."
          fi
          if [[ "$LINUX" == success ]]; then
            notes+=$'\n\n'"**Linux:** the .deb, the .rpm, the AppImage or the tarball."
          else
            echo "::warning::the Linux packages did not build; this release has none"
          fi
          if [[ "$WINDOWS" == success ]]; then
            notes+=$'\n\n'"**Windows:** the MSI installs Matty for you alone, with no administrator prompt. It is not code signed yet, so SmartScreen may warn: choose More info, then Run anyway."
          else
            echo "::warning::the Windows installer did not build; this release has none"
          fi
          # The release PR's CHANGELOG.md entry comes first.
          if [[ -f CHANGELOG.md ]]; then
            entry="$(awk -v v="$VERSION" '
              /^## / { if (found) exit; if (index($0, "[" v "]") || $2 == v) { found = 1; next } }
              found { print }' CHANGELOG.md)"
            [[ -z "$entry" ]] || notes="$entry"$'\n\n'"$notes"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # An earlier run published it; add anything missing.
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --notes "$notes" "${args[@]}"
          fi

  homebrew:
    # Opens a pull request on the tap that bumps the cask (#203). Stable
    # releases only, and only once HOMEBREW_TAP_TOKEN (a token that can push
    # to karyalabs/homebrew-matty and open pull requests there) is set.
    name: Homebrew cask bump
    needs: [build, publish]
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - if: env.HAS_TAP_TOKEN != 'true'
        run: echo "HOMEBREW_TAP_TOKEN is not set; skipping the cask bump"
      - if: env.HAS_TAP_TOKEN == 'true'
        uses: actions/checkout@v4
      - name: Open the bump pull request
        if: env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          TAP: karyalabs/homebrew-matty
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          gh auth setup-git
          gh repo clone "$TAP" "$RUNNER_TEMP/tap" -- --depth 1
          mkdir -p "$RUNNER_TEMP/tap/Casks"
          scripts/homebrew-cask "$VERSION" "$RUNNER_TEMP/SHA256SUMS" >"$RUNNER_TEMP/tap/Casks/matty.rb"
          cd "$RUNNER_TEMP/tap"
          if [[ -z "$(git status --porcelain -- Casks/matty.rb)" ]]; then
            echo "The cask is already at $VERSION"
            exit 0
          fi
          branch="matty-$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Casks/matty.rb
          git commit -m "matty $VERSION"
          git push origin "$branch"
          gh pr create --repo "$TAP" --head "$branch" --title "matty $VERSION" \
            --body "Bumps the cask to [Matty $VERSION](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION)."

  # matty.jha.sh, the browser build (docs/web.md), from the release commit.
  web:
    name: deploy matty.jha.sh
    needs: [plan, publish]
    if: needs.publish.result == 'success'
    runs-on: ${{ fromJSON(vars.KARYA_LINUX_RUNNER || vars.MATTY_LINUX_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    environment: release
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the release environment; deploy matty.jha.sh with scripts/web deploy"
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          clean: ${{ runner.environment != 'self-hosted' }}
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: karyalabs/.github/actions/self-hosted-prep@v1
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: karyalabs/.github/actions/rust-toolchain@v1
        with:
          toolchain: nightly-2026-08-17
          targets: wasm32-unknown-unknown
          components: rust-src
      - name: Install wasm-bindgen and wasm-opt
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          version="$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)"
          scripts/ci/fetch-tool wasm-bindgen "$version" \
            "https://github.com/rustwasm/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" - \
            "wasm-bindgen-$version-x86_64-unknown-linux-musl/wasm-bindgen" 1
          scripts/ci/fetch-tool wasm-opt 132 \
            https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz - \
            binaryen-version_132/bin/wasm-opt 2
      - if: env.HAS_CLOUDFLARE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/web deploy
