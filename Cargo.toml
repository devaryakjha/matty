[workspace]
members = ["crates/*", "spikes/*"]
default-members = ["crates/matty"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/devaryakjha/matty"
publish = false

# Every shared dependency version lives here. Upstream UI pins are exact and
# move together; see docs/PINS.md before changing any of them.
[workspace.dependencies]
gpuicn = "=0.9.7"
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit"] }
gpui-icons = "=0.6.0"
web-time = "1.1"
fluent-bundle = "0.16"
unic-langid = "0.9"
sys-locale = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
if-watch = { version = "3.2", features = ["tokio"] }
url = "2"
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
wiremock = "0.6.5"
rcgen = "0.14"
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
proptest = { version = "1", default-features = false, features = ["std"] }
dirs = "6"
# The updater (#180) verifies ed25519 signatures and SHA-256 sums with the
# crypto provider rustls already builds, with the same features.
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
base64 = "0.22"
semver = "1"
jiff = "0.2"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry", "ansi"] }
tracing-appender = "0.2"
regex = "1"
emojis = "0.6"
async-channel = "2"
async-executor = "1.14"
futures-lite = "2.6"
getrandom = "0.3"
# Raises the open file limit at launch (#206), without unsafe code.
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
pulldown-cmark = { version = "0.13", default-features = false }
insta = "1"
keyring = "4.2"
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder", "NSSound"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }

matty-api = { path = "crates/matty-api" }
matty-store = { path = "crates/matty-store" }
matty-sync = { path = "crates/matty-sync" }
matty-markdown = { path = "crates/matty-markdown" }
matty-notify = { path = "crates/matty-notify" }
matty-app = { path = "crates/matty-app" }
matty-update = { path = "crates/matty-update" }
matty-spell = { path = "crates/matty-spell" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"
print_stdout = "deny"

[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# The browser build (scripts/web): small over fast, since every visit downloads it.
[profile.web]
inherits = "release"
opt-level = "z"
lto = "fat"
