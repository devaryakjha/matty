[package]
name = "matty-app"
description = "The Matty GPUI app: windows, views, actions, keymap and settings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpuicn.workspace = true
gpui-kit.workspace = true
gpui_platform.workspace = true
gpui-icons.workspace = true
web-time.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
regex.workspace = true
emojis.workspace = true
matty-api.workspace = true
matty-sync.workspace = true
matty-markdown.workspace = true
matty-notify.workspace = true
matty-update.workspace = true
async-channel.workspace = true
getrandom.workspace = true
url.workspace = true
jiff.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tracing-appender.workspace = true
keyring.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Storage", "Window", "console"] }
# The browser's clock and time zone, and a bundled zone database, since the
# web has no /usr/share/zoneinfo.
jiff = { workspace = true, features = ["js", "tzdb-bundle-always"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[features]
# Compiles Metal shaders at runtime so macOS builds need no Xcode Metal toolchain.
runtime_shaders = ["gpui_platform/runtime_shaders"]
