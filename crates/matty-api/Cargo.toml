[package]
name = "matty-api"
description = "Mattermost REST v4 and WebSocket client with typed models. No GPUI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reqwest.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
bytes.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true
web-time.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
reqwest = { workspace = true, features = ["rustls", "http2", "stream"] }
rustls.workspace = true
rustls-platform-verifier.workspace = true
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["net"] }

[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-net = { version = "0.6", default-features = false, features = ["websocket"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "test-util"] }
wiremock.workspace = true
rcgen.workspace = true
tokio-rustls.workspace = true
proptest.workspace = true
rustls-platform-verifier.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
