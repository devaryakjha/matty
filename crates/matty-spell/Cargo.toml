[package]
name = "matty-spell"
description = "Spell checking for the composer: word splitting and the platform's checker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Hunspell dictionaries, read in pure Rust: the system's on Linux, and any
# the app ships or the tests bring.
spellbook = "0.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { workspace = true, features = ["NSSpellChecker"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSEnumerator", "NSRange"] }
